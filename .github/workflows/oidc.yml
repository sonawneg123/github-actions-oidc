name: OIDC Token Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC Token
        uses: github/actions-oidc-debugger@v1
        with:
          audience: sts.amazonaws.com