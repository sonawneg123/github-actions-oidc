name: Deploy to Private EC2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::900360460803:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Run command on Private EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0b68c5318bccd9dc2 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["whoami","hostname","uptime"]' \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0b68c5318bccd9dc2 \
            --region us-east-1

          echo "===== EC2 OUTPUT ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0b68c5318bccd9dc2 \
            --region us-east-1 \
            --query "StandardOutputContent" \
            --output text